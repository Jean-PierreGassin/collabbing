services:
  nginx:
    image: ${IMAGE}
    command:
      - sh
      - -lc
      - until getent hosts app >/dev/null; do sleep 1; done; exec nginx -g 'daemon off;'
    ports:
      - target: 80
        published: ${APP_HTTP_PORT:-80}
        protocol: tcp
        mode: ingress
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    depends_on:
      - app
    networks:
      - app_network
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    deploy:
      replicas: ${NGINX_REPLICAS:-2}
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any

  app:
    image: ${IMAGE}
    command: ["php-fpm"]
    user: www-data
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    networks:
      - app_network
    cap_drop:
      - ALL
    volumes:
      - app_storage:/var/www/html/storage
    deploy:
      replicas: ${APP_REPLICAS:-2}
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any

  queue:
    image: ${IMAGE}
    command:
      - sh
      - -lc
      - until getent hosts redis >/dev/null && getent hosts mysql >/dev/null; do sleep 1; done; exec php artisan queue:work redis --sleep=3 --tries=3 --timeout=120 --memory=256
    user: www-data
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    networks:
      - app_network
    cap_drop:
      - ALL
    volumes:
      - app_storage:/var/www/html/storage
    deploy:
      replicas: ${QUEUE_REPLICAS:-1}
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any

  scheduler:
    image: ${IMAGE}
    command:
      - sh
      - -lc
      - until getent hosts redis >/dev/null && getent hosts mysql >/dev/null; do sleep 1; done; exec php artisan schedule:work
    user: www-data
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    networks:
      - app_network
    cap_drop:
      - ALL
    volumes:
      - app_storage:/var/www/html/storage
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any

  redis:
    image: redis:8.6-alpine
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - app_network
    volumes:
      - redis_data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  mysql:
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - app_network
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      replicas: 1
      restart_policy:
        condition: any

networks:
  app_network:
    driver: overlay
    attachable: true

volumes:
  app_storage:
  redis_data:
  mysql_data:
